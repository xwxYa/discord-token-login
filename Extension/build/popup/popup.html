<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="dark" />
	<link rel="stylesheet" href="popup.css" />
	<title>TOKEN LOGIN</title>
</head>
<body class="preload">
  <div class="popup" id="popup">

    <header class="topbar">
      <h1>TOKEN <span>LOGIN</span></h1>
    </header>

    <div class="layout">
      <nav class="rail">
        <div class="groups" id="groups"></div>
        <div class="rail-spacer"></div>
        <button class="rail-btn for-add" id="openGroupModal" data-tip="Create Group">
          <span class="bg"></span>
          <svg viewBox="0 -960 960 960"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></svg>
        </button>
      </nav>

      <section class="content">
        <div class="account-list" id="accounts"></div>
        <button class="fab" id="openAccountModal">
          <span class="bg"></span>
          <svg viewBox="0 -960 960 960"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></svg>
          <span class="tip2">Add Account</span>
        </button>
      </section>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="tip" id="tip"></div>

    <div class="modal" id="groupModal" inert>
      <div class="modal-header">
        <h2>CREATE <em>GROUP</em></h2>
        <button class="modal-close" data-close>
          <svg viewBox="0 0 24 24"><path d="M18.4 4L12 10.4 5.6 4 4 5.6 10.4 12 4 18.4 5.6 20 12 13.6 18.4 20 20 18.4 13.6 12 20 5.6z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <input id="groupName" placeholder="Group Name" maxlength="20" autocomplete="off" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn primary" id="confirmGroup">Create Group</button>
      </div>
    </div>

    <div class="modal" id="accountModal" inert>
      <div class="modal-header">
        <h2 id="accModalTitle">ADD <em>ACCOUNT</em></h2>
        <button class="modal-close" data-close>
          <svg viewBox="0 0 24 24"><path d="M18.4 4L12 10.4 5.6 4 4 5.6 10.4 12 4 18.4 5.6 20 12 13.6 18.4 20 20 18.4 13.6 12 20 5.6z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <input id="accName" placeholder="Account Name" maxlength="18" autocomplete="off" />
          <span class="preview" id="avatarPreview"></span>
        </div>
        <div class="field">
          <input id="accImage" placeholder="Avatar URL" autocomplete="off" />
          <button class="btn-mini" id="fetchAvatar">Fetch</button>
        </div>
        <div class="field">
          <input id="accToken" type="password" placeholder="Account Token" autocomplete="off" />
          <button class="btn-mini" id="fetchToken">Get Token</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn primary" id="confirmAccount">Add Account</button>
      </div>
    </div>

    <div class="ctxmenu" id="accCtx">
      <button data-act="update">Update Account</button>
      <button data-act="delete" class="danger">Delete Account</button>
    </div>
    <div class="ctxmenu" id="grpCtx">
      <button data-act="import">Import Accounts</button>
      <button data-act="export">Export Accounts</button>
      <div class="sep"></div>
      <button data-act="delete" class="danger">Delete Group</button>
    </div>

    <div class="toasts" id="toasts"></div>
  </div>

	<!-- 组右键 → Import Accounts 用的隐藏文件选择器 -->
	<input type="file" accept=".json,.txt,application/json" hidden />
	<script src="popup.js"></script>
</body>
</html>
